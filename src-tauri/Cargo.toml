[package]
name = "titanssh"
version = "0.1.5"
description = "A SSH Client"
authors = ["Seeker32"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.10.3", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "rt", "rt-multi-thread", "macros"] }
ssh2 = "0.9"
# 主机身份指纹：SHA-256（默认 features 含 std，供 fingerprint 计算使用）
sha2 = "0.10"
# OpenSSH 风格指纹的 base64（无填充）编码
base64 = "0.22"
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
# Linux: sync-secret-service 为主存储，linux-native 提供无密钥环守护时的内核 keyring 回退
keyring = { version = "3.6.3", features = ["apple-native", "windows-native", "sync-secret-service", "linux-native"] }
# 下载安全发布：persist_noclobber（Reject 竞态安全）与 persist（Overwrite 原子替换，
# Windows 走 MoveFileEx REPLACE_EXISTING）；默认 features 即可
tempfile = "3.27"
thiserror = "1.0"
anyhow = "1.0"
log = "0.4"
env_logger = { version = "0.11", default-features = false }
dirs = "6"
tauri-plugin-dialog = "2.6.0"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7"

[target.'cfg(target_os = "linux")'.dependencies]
# 仅用于识别 Secret Service 守护未注册的 DBus 错误；不为锁定或拒绝访问降级到易失存储
dbus-secret-service = { version = "4.1.0", default-features = false }

[dev-dependencies]
proptest = "1.4"
mockall = "0.12"
tauri = { version = "2.10.3", features = ["test"] }
url = "2"

[target.'cfg(target_os = "linux")'.dev-dependencies]
# 仅用于构造带 DBus 错误名称的 Secret Service 回退链单元测试
dbus = { version = "0.9.10", default-features = false }

[features]
custom-protocol = ["tauri/custom-protocol"]
