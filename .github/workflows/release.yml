name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lint:
    name: Lint (cargo fmt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # Rust 代码三平台同源，格式检查在单一 Linux runner 跑一次即可；
      - run: cargo fmt --all --check --manifest-path src-tauri/Cargo.toml

  build:
    name: Build ${{ matrix.name }}
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS-arm64
            os: macos-15
            artifacts: src-tauri/target/release/bundle/dmg/*.dmg
          - name: macOS-x64
            os: macos-15-intel
            artifacts: src-tauri/target/release/bundle/dmg/*.dmg
          - name: Windows
            os: windows-latest
            artifacts: |
              src-tauri/target/release/bundle/nsis/*.exe
              src-tauri/target/release/bundle/msi/*.msi
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      # Tauri's Windows test binaries omit the Common Controls v6 manifest and cannot start.
      # Rust tests run on both macOS builders; Windows still compiles and packages the app.
      - run: cargo test --manifest-path src-tauri/Cargo.toml
        if: runner.os != 'Windows'
      - run: pnpm tauri build
      - uses: actions/upload-artifact@v7
        with:
          name: TitanSSH-${{ matrix.name }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true
      - name: Extract release notes
        run: node scripts/release-notes.mjs "$GITHUB_REF_NAME" CHANGELOG.md release-notes.md
      - uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: release-assets/**/*
